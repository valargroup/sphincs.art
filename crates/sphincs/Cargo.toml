[package]
name = "sphincs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The leanSphincs candidate: a two-level WOTS forest under WOTS+C (64 chains of length 4, T = 128), heights 20 to 28, pruned or layered, over Keccak-256, BLAKE2s or SHA-256"

[lints]
workspace = true

[features]
default = ["std"]
# Without it the crate is no_std (it still needs `alloc`), and `compressions` always returns 0.
std = []
# Keep diagnostic thread-local accounting out of normal signing and key generation. It counts in
# thread-local storage, so it needs `std`.
hash-counts = ["std"]

[dependencies]
keccak.workspace = true
blake2s.workspace = true
sha256.workspace = true
sha2 = "=0.11.1"
shake = "=0.1.0"
hmac = "=0.13.0"

[[bench]]
name = "configurations"
harness = false
required-features = ["hash-counts"]

[[example]]
name = "memory192"
required-features = ["hash-counts"]
